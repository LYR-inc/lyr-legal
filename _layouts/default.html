<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <meta name="theme-color" content="#08090b" />
    <link rel="icon" href="https://lyr.jp/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="https://lyr.jp/apple-touch-icon.png" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    <meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}" />
    <meta property="og:description" content="{{ page.description | default: site.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LYR" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="https://lyr.jp/og/default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 法務文書は検索結果に出す必要が無く、出すと本体サイトより先に当たることがある。
         リンクは辿らせたいので nofollow は付けない。 -->
    <meta name="robots" content="noindex, follow" />
  </head>
  <body>
    <header class="lg-head">
      <div class="lg-head-inner">
        <a class="lg-brand" href="https://lyr.jp/">LYR</a>
        <span class="lg-tag">Legal</span>
        <a class="lg-back" href="https://lyr.jp/">lyr.jp へ戻る →</a>
      </div>
    </header>

    <main>
      <div class="lg-doc">
        {{ content }}

        <!-- 2 文書しかないので、末尾で相互に行き来できるようにする。
             アプリの設定画面からは片方だけを開くため、もう一方への導線がここにないと
             ブラウザの戻る以外に手段がなくなる。 -->
        {% unless page.url == '/' or page.url == '/index.html' %}
        <nav class="lg-switch">
          <a href="{{ '/privacy.html' | relative_url }}"{% if page.url contains 'privacy' %} aria-current="page"{% endif %}>プライバシーポリシー</a>
          <a href="{{ '/terms.html' | relative_url }}"{% if page.url contains 'terms' %} aria-current="page"{% endif %}>利用規約</a>
        </nav>
        {% endunless %}
      </div>
    </main>

    <footer class="lg-foot">
      <div class="lg-foot-inner">
        <span>© LYR</span>
        <a href="mailto:hello@lyr.jp">hello@lyr.jp</a>
      </div>
    </footer>
  </body>
</html>
