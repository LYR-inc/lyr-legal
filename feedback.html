<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LYR フィードバック / Feedback</title>
<!--
  LYR アプリの「フィードバックを送る」からの入口。

  ★アプリはフォームを直接指さず、必ずこのページを経由する。
  出荷済み APK に埋め込んだ URL は後から変えられないため、フォームを直書きすると
  内部テスト用フォームから本番用へ差し替えたときに、既に配布された端末が永久に
  古いフォームを指し続ける。ここを挟めば下の FORM を書き換えるだけで全端末が追従する。

  アプリは短い汎用キー (v / d / l) で端末情報を渡す。フォームの entry ID への対応付けは
  この MAP だけに置く。そうするとフォームを作り直して entry ID が変わっても
  (entry ID はフォーム固有で、複製すると変わる) アプリ側は無傷で済む。

  差し替え手順: FORMS の該当言語の form と map を直して commit するだけ。アプリの更新は不要。

  ★言語の振り分け（2026-10-27）: アプリの UI 言語（l）が ja で始まれば日本語版、それ以外は英語版。
  l が無ければブラウザの言語で同じ判定。英語版が未設定（REPLACE_ が残っている）なら日本語版へ送る。
-->
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: #3a3a3a; background: #fbfbfa;
  }
  main { text-align: center; padding: 24px; }
  a { color: #2b6cb0; }
  @media (prefers-color-scheme: dark) {
    body { color: #d6d6d6; background: #1b1b1b; }
    a { color: #7fb3e8; }
  }
</style>
</head>
<body>
<main>
  <p>フィードバックフォームを開いています… / Opening the feedback form…</p>
  <p><a id="fallback" href="#">開かない場合はこちら / Tap here if it does not open</a></p>
</main>
<script>
(function () {
  // ==== 差し替えるのはここと、末尾 noscript の URL ====
  // 2026-08-06: 内部テスト用フォーム。個人アカウント所有の版に差し替え。
  //   Workspace アカウントで作るとフォーム下部に「このフォームは <組織名> 内部で作成されました」と
  //   組織名が出るため (テスターから別名義に見える / EU 法人だと EEA 除外の建て付けと干渉する)。
  //   Workspace → 個人のオーナー移行は Drive の制約でできないので作り直している。
  //   旧フォーム 2 本 (1FAIpQLSefxuMl6... / 1FAIpQLSdS4Y...) は回答 0 件のまま破棄。
  //
  // ★差し替え直後の 10 分間は古い版が使われる。GitHub Pages が Cache-Control: max-age=600 を
  //   返すため。古い entry ID は Google 側に黙って捨てられ「prefill されない」形で現れるので、
  //   実機確認は 10 分待つか ?cb=<適当な値> を付けて行うこと (2026-08-06 に踏んだ)。
  var FORMS = {
    ja: {
      form: "https://docs.google.com/forms/d/e/1FAIpQLSdeKABY3UCs9IBpslTJ5t4paAzn-MIFC-AXYwcCK_2kvtQzxg/viewform",
      map: {
        v: "entry.1422426635",  // アプリバージョン
        d: "entry.1982042586",  // 端末
        l: "entry.1356152833"   // UI 言語
      }
    },
    // ★create_feedback_form.gs の createLyrFeedbackFormEn() のログ（FORM_URL・ENTRY_*）を転記する
    en: {
      form: "https://docs.google.com/forms/d/e/1FAIpQLSe62ADfBj_417v4MOXwZvFwNHhujlF2tHQYJk2x26NeW5Kurg/viewform",
      map: {
        v: "entry.1243702480",
        d: "entry.561685847",
        l: "entry.197908203"
      }
    }
  };
  // ====================================

  var params = new URLSearchParams(location.search);
  var lang = (params.get("l") || navigator.language || "ja").toLowerCase();
  var pick = lang.indexOf("ja") === 0 ? FORMS.ja : FORMS.en;
  if (pick.form.indexOf("REPLACE_") !== -1) pick = FORMS.ja;   // 英語版が未設定なら日本語版へ
  var FORM = pick.form, MAP = pick.map;
  if (pick === FORMS.en) document.documentElement.lang = "en";
  var out = new URLSearchParams();
  var mapped = false;

  Object.keys(MAP).forEach(function (key) {
    var value = params.get(key);
    // entry ID が未設定のまま (REPLACE_ が残っている) なら prefill を諦めて素のフォームを開く。
    // 中途半端な entry.REPLACE_... を投げると Google 側で無視されるだけだが、URL が汚れるので落とす。
    if (value && MAP[key].indexOf("REPLACE_") === -1) {
      out.set(MAP[key], value);
      mapped = true;
    }
  });

  var target = FORM;
  if (mapped) {
    out.set("usp", "pp_url");
    target = FORM + "?" + out.toString();
  }

  document.getElementById("fallback").href = target;
  // replace: 戻るボタンでこの中継ページに戻らないようにする
  location.replace(target);
})();
</script>
<noscript>
  <!-- ★上の FORM と同じ URL を書く。JS 無効だとスクリプトから書き換えられないため、
       ここだけは重複を持つしかない。差し替え時はこちらも直すこと。 -->
  <p><a href="https://docs.google.com/forms/d/e/1FAIpQLSdeKABY3UCs9IBpslTJ5t4paAzn-MIFC-AXYwcCK_2kvtQzxg/viewform">フィードバックフォームを開く</a></p>
  <p><a href="https://docs.google.com/forms/d/e/1FAIpQLSe62ADfBj_417v4MOXwZvFwNHhujlF2tHQYJk2x26NeW5Kurg/viewform">Open the feedback form (English)</a></p>
</noscript>
</body>
</html>
