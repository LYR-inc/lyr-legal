<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lyr フィードバック</title>
<!--
  Lyr アプリの「フィードバックを送る」からの入口。

  ★アプリはフォームを直接指さず、必ずこのページを経由する。
  出荷済み APK に埋め込んだ URL は後から変えられないため、フォームを直書きすると
  内部テスト用フォームから本番用へ差し替えたときに、既に配布された端末が永久に
  古いフォームを指し続ける。ここを挟めば下の FORM を書き換えるだけで全端末が追従する。

  アプリは短い汎用キー (v / d / l) で端末情報を渡す。フォームの entry ID への対応付けは
  この MAP だけに置く。そうするとフォームを作り直して entry ID が変わっても
  (entry ID はフォーム固有で、複製すると変わる) アプリ側は無傷で済む。

  差し替え手順: FORM と MAP の 2 つを直して commit するだけ。アプリの更新は不要。
-->
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: #3a3a3a; background: #fbfbfa;
  }
  main { text-align: center; padding: 24px; }
  a { color: #2b6cb0; }
  @media (prefers-color-scheme: dark) {
    body { color: #d6d6d6; background: #1b1b1b; }
    a { color: #7fb3e8; }
  }
</style>
</head>
<body>
<main>
  <p>フィードバックフォームを開いています…</p>
  <p><a id="fallback" href="#">開かない場合はこちら</a></p>
</main>
<script>
(function () {
  // ==== 差し替えるのはここと、末尾 noscript の URL ====
  // 2026-08-06: 内部テスト用フォーム (LYR 表記統一 + 国 / 地域の設問を追加した版に差し替え)。
  //             旧フォーム (1FAIpQLSefxuMl6...) は回答 0 件のまま破棄。
  var FORM = "https://docs.google.com/forms/d/e/1FAIpQLSdS4Y_VUP5By7UpESl2_mR7i-HLDqDgEPhm4UCcDICPMAWK-A/viewform";
  // ★ここは Apps Script の item.getId() ではなく、**prefill 用の entry ID**。
  //   両者は別物で、item ID を書くと Google 側に黙って無視され prefill が効かない。
  //   取得法は create_feedback_form.gs の logPrefillEntryIds() を参照。
  var MAP = {
    v: "entry.1088394266",  // アプリバージョン
    d: "entry.713008000",   // 端末
    l: "entry.373375709"    // UI 言語
  };
  // ====================================

  var params = new URLSearchParams(location.search);
  var out = new URLSearchParams();
  var mapped = false;

  Object.keys(MAP).forEach(function (key) {
    var value = params.get(key);
    // entry ID が未設定のまま (REPLACE_ が残っている) なら prefill を諦めて素のフォームを開く。
    // 中途半端な entry.REPLACE_... を投げると Google 側で無視されるだけだが、URL が汚れるので落とす。
    if (value && MAP[key].indexOf("REPLACE_") === -1) {
      out.set(MAP[key], value);
      mapped = true;
    }
  });

  var target = FORM;
  if (mapped) {
    out.set("usp", "pp_url");
    target = FORM + "?" + out.toString();
  }

  document.getElementById("fallback").href = target;
  // replace: 戻るボタンでこの中継ページに戻らないようにする
  location.replace(target);
})();
</script>
<noscript>
  <!-- ★上の FORM と同じ URL を書く。JS 無効だとスクリプトから書き換えられないため、
       ここだけは重複を持つしかない。差し替え時はこちらも直すこと。 -->
  <p><a href="https://docs.google.com/forms/d/e/1FAIpQLSdS4Y_VUP5By7UpESl2_mR7i-HLDqDgEPhm4UCcDICPMAWK-A/viewform">フィードバックフォームを開く</a></p>
</noscript>
</body>
</html>
